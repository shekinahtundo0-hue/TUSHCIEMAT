openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: |
    Tushciemat school operations API.
    Every school-scoped request must send the `X-School-Id` header for the
    school the caller is acting in. Errors use the envelope
    `{ "error": { "code", "message", "requestId" } }`.
servers:
  - url: /api/v1
    description: Versioned API base path
security:
  - FirebaseBearer: []
tags:
  - name: health
  - name: account
  - name: schools
  - name: academics
  - name: students
  - name: attendance
  - name: members
  - name: portal
  - name: platform
  - name: results
  - name: assignments
  - name: learning
  - name: timetable
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Liveness check (does not touch the database)
      security: []
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Readiness check (verifies the database connection)
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        "503": { $ref: "#/components/responses/Error" }
  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: Signed-in profile and school memberships
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
  /schools:
    post:
      operationId: createSchool
      tags: [schools]
      summary: Create a school workspace with its first academic year
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolInput" }
      responses:
        "201":
          description: School created; the caller is its owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/School" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /schools/discover:
    get:
      operationId: listDiscoverableSchools
      tags: [schools]
      parameters:
        - { in: query, name: search, schema: { type: string, maxLength: 160, default: "" } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 101, default: 1 } }
      responses:
        "200":
          description: Public institution metadata only, up to 20 matches
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DirectorySchool" } }
  /schools/discover/{schoolId}:
    get:
      operationId: getDiscoverableSchool
      tags: [schools]
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Public institution metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectorySchool" }
        "404": { $ref: "#/components/responses/Error" }
  /schools/{schoolId}/join-requests:
    post:
      operationId: submitJoinRequest
      tags: [members]
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinRequestInput" }
      responses:
        "201":
          description: Pending request; no permissions granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinRequest" }
        "409": { $ref: "#/components/responses/Error" }
  /schools/{schoolId}/join-with-invitation:
    post:
      operationId: joinWithInvitation
      tags: [members]
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolInvitationInput" }
      responses:
        "200":
          description: Invitation accepted for the selected school and role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedInvitation" }
  /join-requests/mine:
    get:
      operationId: listMyJoinRequests
      tags: [members]
      responses:
        "200":
          description: The authenticated applicant's requests
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/JoinRequest" } }
  /join-requests:
    get:
      operationId: listJoinRequests
      tags: [members]
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      responses:
        "200":
          description: This school's access requests for authorised administrators
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/JoinRequest" } }
  /join-requests/{requestId}/review:
    post:
      operationId: reviewJoinRequest
      tags: [members]
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: requestId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinRequestReview" }
      responses:
        "200":
          description: Atomic decision, account linking, membership and notification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JoinRequest" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /notifications:
    get:
      operationId: listNotifications
      tags: [account]
      responses:
        "200":
          description: Notifications addressed to this account only
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Notification" } }
  /notifications/{notificationId}/read:
    post:
      operationId: markNotificationRead
      tags: [account]
      parameters:
        - { in: path, name: notificationId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Notification marked read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
  /announcements:
    get:
      operationId: listAnnouncements
      tags: [schools]
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      responses:
        "200":
          description: Announcements for active members of this school
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Announcement" } }
    post:
      operationId: publishAnnouncement
      tags: [schools]
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnouncementInput" }
      responses:
        "201":
          description: Published and school members notified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Announcement" }
  /school-settings:
    get:
      operationId: getSchoolSettings
      tags: [schools]
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      responses:
        "200":
          description: School settings for an authorised administrator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/School" }
    patch:
      operationId: updateSchoolSettings
      tags: [schools]
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolSettingsInput" }
      responses:
        "200":
          description: Updated settings; verification cannot be self-assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/School" }
  /dashboard:
    get:
      operationId: getDashboard
      tags: [schools]
      summary: Live counts for the active school
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "403": { $ref: "#/components/responses/Error" }
  /academic-years:
    get:
      operationId: listAcademicYears
      tags: [academics]
      summary: Academic years and their terms
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      responses:
        "200":
          description: Academic years
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AcademicYear" }
    post:
      operationId: createAcademicYear
      tags: [academics]
      summary: Add an academic year
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicYearInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicYear" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /academic-years/{academicYearId}/current:
    post:
      operationId: setCurrentAcademicYear
      tags: [academics]
      summary: Make this the current academic year
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: academicYearId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicYear" }
        "404": { $ref: "#/components/responses/Error" }
  /academic-years/{academicYearId}/terms:
    post:
      operationId: createTerm
      tags: [academics]
      summary: Add a term to an academic year
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: academicYearId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TermInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Term" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /terms/{termId}/current:
    post:
      operationId: setCurrentTerm
      tags: [academics]
      summary: Make this the current term
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: termId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Term" }
        "404": { $ref: "#/components/responses/Error" }
  /classes:
    get:
      operationId: listClasses
      tags: [academics]
      summary: Classes visible to the caller (teachers see assigned classes only)
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      responses:
        "200":
          description: Classes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClassRecord" }
    post:
      operationId: createClass
      tags: [academics]
      summary: Create a class or stream
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClassInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClassRecord" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /classes/{classId}/teachers:
    post:
      operationId: assignTeacher
      tags: [academics]
      summary: Assign a teacher to a class
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: classId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherAssignmentInput" }
      responses:
        "201":
          description: Assigned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherAssignment" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /classes/{classId}/teachers/{assignmentId}:
    delete:
      operationId: removeTeacherAssignment
      tags: [academics]
      summary: Remove a teacher assignment
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: classId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: assignmentId, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/Error" }
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: Search students visible to the caller
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: query, name: search, schema: { type: string, maxLength: 100 } }
        - { in: query, name: classId, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Students page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentPage" }
    post:
      operationId: createStudent
      tags: [students]
      summary: Register a student
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /students/{studentId}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Student record with guardians
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: studentId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Student
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentDetail" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateStudent
      tags: [students]
      summary: Update a student record
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: studentId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Student" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /students/{studentId}/guardians:
    post:
      operationId: addGuardian
      tags: [students]
      summary: Add a parent or guardian to a student
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: studentId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianInput" }
      responses:
        "201":
          description: Linked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianLink" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /students/{studentId}/guardians/{guardianId}:
    delete:
      operationId: removeGuardian
      tags: [students]
      summary: Unlink a guardian from a student
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: studentId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: guardianId, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Unlinked }
        "404": { $ref: "#/components/responses/Error" }
  /attendance:
    get:
      operationId: getAttendanceRegister
      tags: [attendance]
      summary: Class register for one date (roster with any saved marks)
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: query, name: date, required: true, schema: { $ref: "#/components/schemas/CalendarDate" } }
        - { in: query, name: classId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Register
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceRegister" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      operationId: saveAttendance
      tags: [attendance]
      summary: Record or update attendance for a class
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttendanceInput" }
      responses:
        "200":
          description: Saved register
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceRegister" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: People with access to the school
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
  /members/{membershipId}:
    patch:
      operationId: updateMember
      tags: [members]
      summary: Suspend or reactivate a membership
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: membershipId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /members/{membershipId}/capabilities:
    patch:
      operationId: setMemberCapabilities
      tags: [members]
      summary: Replace a co-administrator's delegated capabilities (owner only)
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: membershipId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberCapabilitiesInput" }
      responses:
        "200":
          description: Updated delegation; enforced on subsequent requests
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /invitations:
    get:
      operationId: listInvitations
      tags: [members]
      summary: Pending and past invitations
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      responses:
        "200":
          description: Invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invitation" }
    post:
      operationId: createInvitation
      tags: [members]
      summary: Invite someone to a school role
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationInput" }
      responses:
        "201":
          description: Invitation created. The link is returned once and is not stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedInvitation" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /invitations/{invitationId}/revoke:
    post:
      operationId: revokeInvitation
      tags: [members]
      summary: Revoke a pending invitation
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: invitationId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "404": { $ref: "#/components/responses/Error" }
  /invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [members]
      summary: Accept an invitation as the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcceptInvitationInput" }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedInvitation" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /portal/children:
    get:
      operationId: listMyChildren
      tags: [portal]
      summary: Children linked to the signed-in parent, with recent attendance
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      responses:
        "200":
          description: Children
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LearnerSummary" }
  /portal/learner:
    get:
      operationId: getMyLearnerRecord
      tags: [portal]
      summary: The signed-in learner's own record and recent attendance
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      responses:
        "200":
          description: Learner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LearnerSummary" }
        "404": { $ref: "#/components/responses/Error" }
  /platform/schools:
    get:
      operationId: listPlatformSchools
      tags: [platform]
      summary: All schools (platform staff only)
      responses:
        "200":
          description: Schools
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformSchool" }
        "403": { $ref: "#/components/responses/Error" }
  /results/my-assessments:
    get:
      operationId: listMyAssessments
      tags: [results]
      summary: Assessments for the signed-in learner's class
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: query, name: termId, schema: { type: string, format: uuid } }
        - { in: query, name: subject, schema: { type: string, maxLength: 100 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Assessments page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyAssessmentsPage" }
        "400": { $ref: "#/components/responses/Error" }
  /results/published:
    get:
      operationId: listPublishedResults
      tags: [results]
      summary: Published assessment marks for the signed-in learner
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
