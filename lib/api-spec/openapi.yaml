              schema: { $ref: "#/components/schemas/ManagedAssignment" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /assignments/{assignmentId}/duplicate:
    post:
      operationId: duplicateAssignment
      tags: [assignments]
      summary: Copy an assignment into a new draft
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: assignmentId, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: Draft copy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedAssignment" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /assignments/{assignmentId}/extend-deadline:
    post:
      operationId: extendAssignmentDeadline
      tags: [assignments]
      summary: Give the class more time on a published assignment
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: assignmentId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtendDeadlineInput" }
      responses:
        "200":
          description: Extended assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedAssignment" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /assignments/{assignmentId}/state:
    post:
      operationId: setAssignmentState
      tags: [assignments]
      summary: Archive or cancel an assignment
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: assignmentId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignmentStateInput" }
      responses:
        "200":
          description: Updated assignment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedAssignment" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /assignments/{assignmentId}/submission/upload-targets:
    post:
      operationId: createSubmissionUploadTargets
      tags: [assignments]
      summary: Short-lived storage upload URLs for a learner's own submission files
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: assignmentId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmissionUploadTargetsInput" }
      responses:
        "201":
          description: Upload targets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTargets" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /assignments/{assignmentId}/submissions/{submissionId}/files/{fileId}/download:
    get:
      operationId: downloadSubmissionFile
      tags: [assignments]
      summary: Download one file a learner submitted for marking
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: path, name: assignmentId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: submissionId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: fileId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Signed download link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileDownload" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /timetable/today:
    get:
      operationId: getTodayTimetable
      tags: [timetable]
      summary: Today's schedule for the learner's class
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      responses:
        "200":
          description: Today's periods
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TodayTimetable" }
        "400": { $ref: "#/components/responses/Error" }
  /timetable/week:
    get:
      operationId: getTimetableForWeek
      tags: [timetable]
      summary: Full weekly timetable for the learner's class
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      responses:
        "200":
          description: Week grouped by day
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WeekTimetable" }
        "400": { $ref: "#/components/responses/Error" }
  /timetable:
    get:
      operationId: getTimetableForDate
      tags: [timetable]
      summary: Timetable for a date (defaults to today)
      parameters:
        - { $ref: "#/components/parameters/SchoolId" }
        - { in: query, name: date, schema: { $ref: "#/components/schemas/CalendarDate" } }
        - { in: query, name: classId, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Day's periods
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DateTimetable" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      operationId: upsertTimetableEntry
      tags: [timetable]
      summary: Create or update a timetable period (staff and teachers)
      parameters: [{ $ref: "#/components/parameters/SchoolId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimetableEntryInput" }
      responses:
        "200":
          description: Updated existing period
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimetableEntrySaved" }
        "201":
          description: Created period
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimetableEntrySaved" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token for the configured project.
  parameters:
    SchoolId:
      in: header
      name: X-School-Id
      required: true
      description: The school the caller is acting in.
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    CalendarDate:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      description: Calendar date (YYYY-MM-DD), no timezone.
    SchoolRole:
      type: string
      enum: [owner, school_admin, principal, academic_admin, bursar, teacher, parent, student, tutor]
    SchoolCapability:
      type: string
      enum: [students.manage, academics.manage, attendance.manage, people.manage, requests.review, settings.manage, announcements.manage, assessments.manage, results.publish, resources.manage, staff.manage, workload.manage, communications.manage, classroom.manage, records.delete]
    MemberCapabilitiesInput:
      type: object
      additionalProperties: false
      required: [capabilities]
      properties:
        capabilities:
          type: array
          maxItems: 15
          uniqueItems: true
          items: { $ref: "#/components/schemas/SchoolCapability" }
    PlatformRole:
      type: string
      enum: [platform_admin, platform_support]
    Me:
      type: object
      required: [authUserId, fullName, email, platformRole, schools]
      properties:
        authUserId: { type: string }
        fullName: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        platformRole:
          oneOf: [{ $ref: "#/components/schemas/PlatformRole" }, { type: "null" }]
        schools:
          type: array
          items: { $ref: "#/components/schemas/SchoolAccess" }
    SchoolAccess:
      type: object
      required: [schoolId, schoolName, roles, capabilities]
      properties:
        schoolId: { type: string, format: uuid }
        schoolName: { type: string }
        roles:
          type: array
          items: { $ref: "#/components/schemas/SchoolRole" }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/SchoolCapability" }
    SchoolInput:
      type: object
      additionalProperties: false
      required: [name, category, curriculum, academicYear]
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        category: { type: string, enum: [primary, secondary, mixed, tertiary, other] }
        curriculum: { type: string, minLength: 2, maxLength: 80 }
        county: { type: ["string", "null"], maxLength: 100 }
        country: { type: string, minLength: 2, maxLength: 100 }
        town: { type: ["string", "null"], maxLength: 100 }
        logoUrl: { type: ["string", "null"], maxLength: 2048, pattern: "^https?://" }
        description: { type: ["string", "null"], maxLength: 2000 }
        contactEmail: { type: ["string", "null"], format: email, maxLength: 254 }
        contactPhone: { type: ["string", "null"], maxLength: 30, pattern: "^\\+?[0-9 ()-]{7,30}$" }
        website: { type: ["string", "null"], maxLength: 2048, pattern: "^https?://" }
        discoverable: { type: boolean }
        academicYear: { $ref: "#/components/schemas/AcademicYearInput" }
    School:
      type: object
      required: [id, name, category, curriculum, county, createdAt, country, town, logoUrl, description, contactEmail, contactPhone, website, discoverable, verificationStatus]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        curriculum: { type: string }
        county: { type: ["string", "null"] }
        country: { type: string }
        town: { type: ["string", "null"] }
        logoUrl: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        contactEmail: { type: ["string", "null"] }
        contactPhone: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        discoverable: { type: boolean }
        verificationStatus: { type: string, enum: [unverified, verified] }
        createdAt: { type: string, format: date-time }
    DashboardSummary:
      type: object
      required: [school, currentYear, currentTerm, totalStudents, totalClasses, totalTeachers, markedToday, presentToday, absentToday, attendanceRate]
      properties:
        school: { $ref: "#/components/schemas/School" }
        currentYear: { type: ["string", "null"] }
        currentTerm: { type: ["string", "null"] }
        totalStudents: { type: integer }
        totalClasses: { type: integer }
        totalTeachers: { type: integer }
        markedToday: { type: integer }
        presentToday: { type: integer }
        absentToday: { type: integer }
        attendanceRate: { type: ["number", "null"] }
    AcademicYearInput:
      type: object
      additionalProperties: false
      required: [name, startsOn, endsOn]
      properties:
        name: { type: string, minLength: 2, maxLength: 40 }
        startsOn: { $ref: "#/components/schemas/CalendarDate" }
        endsOn: { $ref: "#/components/schemas/CalendarDate" }
    AcademicYear:
      type: object
      required: [id, name, startsOn, endsOn, isCurrent, terms]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        startsOn: { type: string }
        endsOn: { type: string }
        isCurrent: { type: boolean }
        terms:
          type: array
          items: { $ref: "#/components/schemas/Term" }
    TermInput:
      type: object
      additionalProperties: false
      required: [name, startsOn, endsOn]
      properties:
        name: { type: string, minLength: 2, maxLength: 40 }
        startsOn: { $ref: "#/components/schemas/CalendarDate" }
        endsOn: { $ref: "#/components/schemas/CalendarDate" }
    Term:
      type: object
      required: [id, academicYearId, name, startsOn, endsOn, isCurrent]
      properties:
        id: { type: string, format: uuid }
        academicYearId: { type: string, format: uuid }
        name: { type: string }
        startsOn: { type: string }
        endsOn: { type: string }
        isCurrent: { type: boolean }
    ClassInput:
      type: object
      additionalProperties: false
      required: [name, grade, academicYearId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        grade: { type: string, minLength: 1, maxLength: 40 }
        stream: { type: ["string", "null"], maxLength: 40 }
        academicYearId: { type: string, format: uuid }
    ClassRecord:
      type: object
      required: [id, name, grade, stream, academicYearId, academicYear, studentCount, teachers]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        grade: { type: string }
        stream: { type: ["string", "null"] }
        academicYearId: { type: string, format: uuid }
        academicYear: { type: string }
        studentCount: { type: integer }
        teachers:
          type: array
          items: { $ref: "#/components/schemas/TeacherAssignment" }
    TeacherAssignmentInput:
      type: object
      additionalProperties: false
      required: [teacherUserId, assignmentRole]
      properties:
        teacherUserId: { type: string, minLength: 1, maxLength: 64 }
        assignmentRole: { type: string, enum: [class_teacher, subject_teacher] }
        subject: { type: ["string", "null"], minLength: 1, maxLength: 80 }
    TeacherAssignment:
      type: object
      required: [id, teacherUserId, teacherName, assignmentRole, subject]
      properties:
        id: { type: string, format: uuid }
        teacherUserId: { type: string }
        teacherName: { type: ["string", "null"] }
        assignmentRole: { type: string, enum: [class_teacher, subject_teacher] }
        subject: { type: ["string", "null"] }
    StudentInput:
      type: object
      additionalProperties: false
      required: [firstName, lastName, admissionNumber]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        admissionNumber: { type: string, minLength: 1, maxLength: 40 }
        classId: { type: ["string", "null"], format: uuid }
        status: { type: string, enum: [active, transferred, graduated, inactive], default: active }
    StudentUpdate:
      type: object
      additionalProperties: false
      properties:
        firstName: { type: string, minLength: 1, maxLength: 80 }
        lastName: { type: string, minLength: 1, maxLength: 80 }
        admissionNumber: { type: string, minLength: 1, maxLength: 40 }
        classId: { type: ["string", "null"], format: uuid }
        status: { type: string, enum: [active, transferred, graduated, inactive] }
    Student:
      type: object
      required: [id, firstName, lastName, admissionNumber, classId, className, status, hasAccount, guardianCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        admissionNumber: { type: string }
        classId: { type: ["string", "null"] }
        className: { type: ["string", "null"] }
        status: { type: string, enum: [active, transferred, graduated, inactive] }
        hasAccount: { type: boolean }
        guardianCount:
          type: ["integer", "null"]
          description: Null when the caller's role cannot see guardian records.
        createdAt: { type: string, format: date-time }
    StudentDetail:
      allOf:
        - { $ref: "#/components/schemas/Student" }
        - type: object
          required: [guardians]
          properties:
            guardians:
              description: Null when the caller's role cannot see guardian records.
              oneOf:
                - type: array
                  items: { $ref: "#/components/schemas/GuardianLink" }
                - type: "null"
    StudentPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Student" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    GuardianInput:
      type: object
      additionalProperties: false
      description: |
        A guardian already on file at this school with the same email (or,
        without an email, the same phone) and the same name is reused, so
        siblings share one parent record and one parent account. A matching
        email or phone under a different name is rejected with 409.
      required: [fullName, relationship]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 160 }
        email: { type: ["string", "null"], format: email, maxLength: 254 }
        phone: { type: ["string", "null"], pattern: "^\\+?[0-9 ]{7,20}$" }
        relationship: { type: string, enum: [mother, father, guardian, grandparent, sibling, sponsor, other] }
        isPrimary: { type: boolean, default: false }
    GuardianLink:
      type: object
      required: [guardianId, fullName, email, phone, relationship, isPrimary, hasAccount]
      properties:
        guardianId: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        relationship: { type: string }
        isPrimary: { type: boolean }
        hasAccount: { type: boolean }
    AttendanceStatus:
      type: string
      enum: [present, absent, late, excused]
    AttendanceInput:
      type: object
      additionalProperties: false
      required: [classId, date, records]
      properties:
        classId: { type: string, format: uuid }
        date: { $ref: "#/components/schemas/CalendarDate" }
        records:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [studentId, status]
            properties:
              studentId: { type: string, format: uuid }
              status: { $ref: "#/components/schemas/AttendanceStatus" }
              note: { type: ["string", "null"], maxLength: 500 }
    AttendanceRegister:
      type: object
      required: [classId, date, entries]
      properties:
        classId: { type: string, format: uuid }
        date: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/AttendanceEntry" }
    AttendanceEntry:
      type: object
      required: [studentId, studentName, admissionNumber, status, note]
      properties:
        studentId: { type: string, format: uuid }
        studentName: { type: string }
        admissionNumber: { type: string }
        status:
          oneOf: [{ $ref: "#/components/schemas/AttendanceStatus" }, { type: "null" }]
        note: { type: ["string", "null"] }
    Member:
      type: object
      required: [membershipId, authUserId, fullName, email, role, status, createdAt, capabilities]
      properties:
        membershipId: { type: string, format: uuid }
        authUserId: { type: string }
        fullName: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        role: { $ref: "#/components/schemas/SchoolRole" }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: string, format: date-time }
        capabilities:
          type: array
          items: { $ref: "#/components/schemas/SchoolCapability" }
    MemberUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [active, suspended] }
    InvitationInput:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        role: { $ref: "#/components/schemas/SchoolRole" }
        studentId: { type: ["string", "null"], format: uuid }
        guardianId: { type: ["string", "null"], format: uuid }
    Invitation:
      type: object
      required: [id, email, role, status, expiresAt, createdAt, studentName, guardianName]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/SchoolRole" }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        studentName: { type: ["string", "null"] }
        guardianName: { type: ["string", "null"] }
    CreatedInvitation:
      type: object
      required: [invitation, acceptPath]
      properties:
        invitation: { $ref: "#/components/schemas/Invitation" }
        acceptPath:
          type: string
          description: Relative link containing the one-time token. Share it with the invitee.
    AcceptInvitationInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
    AcceptedInvitation:
      type: object
      required: [schoolId, role]
      properties:
        schoolId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/SchoolRole" }
    LearnerSummary:
      type: object
      required: [studentId, firstName, lastName, admissionNumber, className, status, attendance]
      properties:
        studentId: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        admissionNumber: { type: string }
        className: { type: ["string", "null"] }
        status: { type: string }
        attendance: { $ref: "#/components/schemas/AttendanceSummary" }
    AttendanceSummary:
      type: object
      required: [sinceDate, present, absent, late, excused, recent]
      properties:
        sinceDate: { type: string }
        present: { type: integer }
        absent: { type: integer }
        late: { type: integer }
        excused: { type: integer }
        recent:
          type: array
          items:
            type: object
            required: [date, status]
            properties:
              date: { type: string }
              status: { $ref: "#/components/schemas/AttendanceStatus" }
    PlatformSchool:
      type: object
      required: [id, name, category, county, createdAt, activeMembers, activeStudents]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        county: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        activeMembers: { type: integer }
        activeStudents: { type: integer }
    DirectorySchool:
      type: object
      required: [id, name, category, country, county, town, logoUrl, description, verificationStatus]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: string }
        country: { type: string }
        county: { type: ["string", "null"] }
        town: { type: ["string", "null"] }
        logoUrl: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        verificationStatus: { type: string, enum: [unverified, verified] }
    JoinRequestRole:
      type: string
      enum: [student, teacher, school_admin, parent]
    JoinRequestInput:
      type: object
      additionalProperties: false
      required: [requestedRole, fullName]
      properties:
        requestedRole: { $ref: "#/components/schemas/JoinRequestRole" }
        fullName: { type: string, minLength: 2, maxLength: 160 }
        admissionNumber: { type: string, maxLength: 40 }
        programme: { type: string, maxLength: 160 }
        academicYear: { type: string, maxLength: 40 }
        staffNumber: { type: string, maxLength: 80 }
        department: { type: string, maxLength: 160 }
        subjects: { type: string, maxLength: 500 }
        classes: { type: string, maxLength: 500 }
        position: { type: string, maxLength: 160 }
        reason: { type: string, maxLength: 1000 }
        relationship: { type: string, maxLength: 80 }
    JoinRequest:
      type: object
      required: [id, schoolId, authUserId, requestedRole, schoolName, applicantName, applicantEmail, applicantDetails, status, submittedAt, reviewedByUserId, reviewedAt, rejectionReason, studentId, guardianId]
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        authUserId: { type: string }
        requestedRole: { $ref: "#/components/schemas/JoinRequestRole" }
        schoolName: { type: string }
        applicantName: { type: string }
        applicantEmail: { type: string }
        applicantDetails:
          type: object
          additionalProperties: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        submittedAt: { type: string, format: date-time }
        reviewedByUserId: { type: ["string", "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        rejectionReason: { type: ["string", "null"] }
        studentId: { type: ["string", "null"], format: uuid }
